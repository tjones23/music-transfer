<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Transfer – Apple Music sign-in</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
    button { font-size: 1.05rem; padding: .7rem 1.4rem; border-radius: .5rem; border: 0; background: #fa2d48; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>Connect Apple Music</h1>
  <p>Music Transfer needs permission to create playlists and add songs to your Apple Music library.
     Click the button and sign in with your Apple ID.</p>
  <button id="go" disabled>Loading MusicKit…</button>
  <p id="status"></p>
  <script>
    const DEVELOPER_TOKEN = __DEVELOPER_TOKEN__;
    const btn = document.getElementById('go');
    const status = document.getElementById('status');
    async function send(payload) {
      await fetch('/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }
    document.addEventListener('musickitloaded', async () => {
      try {
        await MusicKit.configure({ developerToken: DEVELOPER_TOKEN, app: { name: 'Music Transfer', build: '0.1.0' } });
        btn.disabled = false;
        btn.textContent = 'Sign in to Apple Music';
      } catch (e) {
        status.textContent = 'MusicKit failed to initialize: ' + e + '. Check your Team ID, Key ID and .p8 key.';
        send({ error: 'MusicKit configure failed: ' + e });
      }
    });
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Waiting for Apple sign-in…';
      try {
        const userToken = await MusicKit.getInstance().authorize();
        if (!userToken) throw new Error('Authorization was not granted');
        await send({ userToken });
        status.textContent = 'Done! You can close this tab and return to the terminal.';
      } catch (e) {
        status.textContent = 'Sign-in failed: ' + e;
        btn.disabled = false;
      }
    });
  </script>
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" data-web-components async></script>
</body>
</html>
