[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-transfer"
version = "0.1.0"
description = "Transfer your Spotify library (playlists, liked songs, albums, preferences) to Apple Music."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "PyJWT[crypto]>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
music-transfer = "music_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_transfer = ["apple/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
